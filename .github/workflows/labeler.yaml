# Do labeling based on the rules

name: Labeler
on:
- pull_request_target

jobs:
  triage:
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4.3.0
      with:
        configuration-path: .github/labeler.yaml
